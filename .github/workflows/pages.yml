name: Publish website and busy calendar

on:
  push:
    branches: [main]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/calendar-requirements.txt
      - name: Install calendar parser
        run: python -m pip install -r scripts/calendar-requirements.txt
      - name: Check privacy, recurrence, and timezone handling
        run: python -m unittest discover -s tests
      - name: Check calendar display and navigation
        run: node --test tests/availability.test.cjs
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp *.html *.css *.js _site/
          cp -R images data _site/
      - name: Refresh busy-only calendar
        env:
          OUTLOOK_ICS_URL: ${{ secrets.OUTLOOK_ICS_URL }}
        run: python scripts/sync_calendar.py --output _site/data/availability.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
